services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: platform
      POSTGRES_PASSWORD: ${PLATFORM_DB_PASSWORD:?set PLATFORM_DB_PASSWORD}
      POSTGRES_DB: platform
    volumes: [platform-db:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U platform]
      interval: 5s
      retries: 12
  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://platform:${PLATFORM_DB_PASSWORD}@db:5432/platform
      MODEL_KEY_ENCRYPTION_KEY: ${MODEL_KEY_ENCRYPTION_KEY:?set MODEL_KEY_ENCRYPTION_KEY}
      MODEL_ALLOWED_HOSTS: ${MODEL_ALLOWED_HOSTS:?set MODEL_ALLOWED_HOSTS}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://127.0.0.1:8001}
    command: [sh, -c, 'alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8001 --workers 1']
    depends_on:
      db: {condition: service_healthy}
    ports: ['127.0.0.1:8001:8001']
  model-db:
    profiles: [models]
    image: postgres:17
    environment:
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: ${MODEL_DB_PASSWORD:-}
      POSTGRES_DB: litellm
    volumes: [model-db:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U litellm]
      interval: 5s
      retries: 12
  gateway:
    profiles: [models]
    image: ${LITELLM_IMAGE:-ghcr.io/berriai/litellm:main-stable}
    environment:
      DATABASE_URL: postgresql://litellm:${MODEL_DB_PASSWORD:-}@model-db:5432/litellm
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-}
      LITELLM_SALT_KEY: ${LITELLM_SALT_KEY:-}
      UI_USERNAME: ${MODEL_ADMIN_USERNAME:-}
      UI_PASSWORD: ${MODEL_ADMIN_PASSWORD:-}
      STORE_MODEL_IN_DB: 'True'
      UPSTREAM_MODEL: ${UPSTREAM_MODEL:-}
      UPSTREAM_BASE_URL: ${UPSTREAM_BASE_URL:-}
      UPSTREAM_API_KEY: ${UPSTREAM_API_KEY:-}
    volumes: ['./deploy/litellm.yaml:/app/config.yaml:ro']
    command: [--config, /app/config.yaml, --port, '4000', --num_workers, '1']
    depends_on:
      model-db: {condition: service_healthy}
    ports: ['127.0.0.1:4000:4000']
volumes:
  platform-db:
  model-db:
